<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroMatrix - Dashboard Astrologica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f4f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #risultato {
            margin-top: 20px;
            padding: 20px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: none;
        }
        .result-title {
            font-size: 20px;
            color: #007bff;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }
        .result-section {
            margin-bottom: 10px;
            font-size: 15px;
            line-height: 1.5;
        }
        .numbers-box {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #d9534f;
            background: #fff3cd;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
        }
        .error {
            color: #dc3545;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>AstroMatrix - Dashboard</h2>

    <form id="numeriForm">
        <div class="form-group">
            <label for="nome">Nome o Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Es. Adolfo">
        </div>

        <div class="form-group">
            <label for="comune">Comune di Nascita:</label>
            <input type="text" id="comune" required placeholder="Es. Napoli">
        </div>

        <div class="form-group">
            <label for="anno">Anno di Nascita (YYYY):</label>
            <input type="number" id="anno" min="1900" max="2099" required placeholder="Es. 1955">
        </div>

        <button type="button" onclick="calcolaAstroMatrix()">Genera Profilo</button>
    </form>

    <div id="risultato"></div>

    <script>
        const databaseComuni = {
            "NAPOLI": 18, "CASERTA": 12, "SAVONA": 7, "UDINE": 15,
            "ROMA": 9, "MILANO": 5, "TORINO": 6, "BOLOGNA": 11, "FIRENZE": 14
        };

        const datiZodiacali = [
            { segno: "Capricorno", inizio: [12, 22], fine: [1, 19], pietra: "Rubino", colore: "Nero / Grigio", affinita: "Toro e Vergine", oroscopo: "La concretezza e la determinazione guidano ogni passo verso traguardi importanti." },
            { segno: "Acquario", inizio: [1, 20], fine: [2, 18], pietra: "Ametista", colore: "Blu Elettrico", affinita: "Gemelli e Bilancia", oroscopo: "Originalità e visione del futuro aprono nuove strade inattese." },
            { segno: "Pesci", inizio: [2, 19], fine: [3, 20], pietra: "Acquamarina", colore: "Verde Acqua", affinita: "Cancro e Scorpione", oroscopo: "L'intuito profondo e la sensibilità guidano le scelte con ispirazione artistica." },
            { segno: "Ariete", inizio: [3, 21], fine: [4, 19], pietra: "Diamante", colore: "Rosso Fuoco", affinita: "Leone e Sagittario", oroscopo: "L'energia vitale e lo spirito pionieristico superano qualsiasi ostacolo." },
            { segno: "Toro", inizio: [4, 20], fine: [5, 20], pietra: "Smeraldo", colore: "Verde", affinita: "Vergine e Capricorno", oroscopo: "Stabilità e amore per il bello consolidano ogni progetto di vita." },
            { segno: "Gemelli", inizio: [5, 21], fine: [6, 20], pietra: "Agata", colore: "Giallo", affinita: "Bilancia e Acquario", oroscopo: "Versatilità e ingegno brillante facilitano la comunicazione e i contatti." },
            { segno: "Cancro", inizio: [6, 21], fine: [7, 22], pietra: "Perla", colore: "Bianco / Argento", affinita: "Scorpione e Pesci", oroscopo: "La memoria e i legami affettivi profondi offrono protezione e forza interiore." },
            { segno: "Leone", inizio: [7, 23], fine: [8, 22], pietra: "Topazio", colore: "Oro / Arancione", affinita: "Ariete e Sagittario", oroscopo: "Carisma e generosità illuminano la scena e attraggono grandi soddisfazioni." },
            { segno: "Vergine", inizio: [8, 23], fine: [9, 22], pietra: "Zaffiro", colore: "Marrone / Blu Scuro", affinita: "Toro e Capricorno", oroscopo: "Precisione e analisi meticolosa portano a risultati eccellenti e duraturi." },
            { segno: "Bilancia", inizio: [9, 23], fine: [10, 22], pietra: "Opale", colore: "Rosa / Celeste", affinita: "Gemelli e Acquario", oroscopo: "Senso dell'armonia e diplomazia creano equilibrio in ogni relazione." },
            { segno: "Scorpione", inizio: [10, 23], fine: [11, 21], pietra: "Topazio", colore: "Rosso Scuro / Nero", affinita: "Cancro e Pesci", oroscopo: "Passione intensa e magnetismo rivelano verità nascoste e grandi potenzialità." },
            { segno: "Sagittario", inizio: [11, 22], fine: [12, 21], pietra: "Turchese", colore: "Blu Scuro / Viola", affinita: "Ariete e Leone", oroscopo: "Ottimismo e spirito d'avventura allargano gli orizzonti verso nuove mete." }
        ];

        function riduciA90(valore) {
            let res = valore % 90;
            return res === 0 ? 90 : res;
        }

        function calcolaValoreTesto(testo) {
            const lettere = testo.toUpperCase().replace(/[^A-Z]/g, '');
            let somma = 0;
            for (let i = 0; i < lettere.length; i++) {
                somma += (lettere.charCodeAt(i) - 64);
            }
            return somma;
        }

        function determinaSegno(nome) {
            // Assegnazione basata sul valore del nome per simulare l'estrazione coerente se non si inserisce il giorno/mese esatto
            let index = calcolaValoreTesto(nome) % 12;
            return datiZodiacali[index];
        }

        function calcolaAstroMatrix() {
            const nomeInput = document.getElementById('nome').value.trim();
            const comuneInput = document.getElementById('comune').value.trim();
            const annoInput = document.getElementById('anno').value.trim();
            const divRisultato = document.getElementById('risultato');

            if (!nomeInput || !comuneInput || !annoInput) {
                divRisultato.style.display = 'block';
                divRisultato.innerHTML = '<div class="error">Compilare tutti i campi correttamente.</div>';
                return;
            }

            const anno = parseInt(annoInput, 10);
            if (isNaN(anno) || anno < 1900 || anno > 2099) {
                divRisultato.style.display = 'block';
                divRisultato.innerHTML = '<div class="error">Inserire un anno di nascita valido a 4 cifre.</div>';
                return;
            }

            const comuneKey = comuneInput.toUpperCase();
            let valoreComune = databaseComuni[comuneKey] !== undefined ? databaseComuni[comuneKey] : calcolaValoreTesto(comuneKey);
            const valoreNome = calcolaValoreTesto(nomeInput);

            // Numeri Astrali
            const num1 = riduciA90(valoreNome + anno);
            const num2 = riduciA90(valoreComune + (anno % 100));
            const num3 = riduciA90(valoreNome + valoreComune + anno);

            // Profilo Astrologico
            const profilo = determinaSegno(nomeInput);

            divRisultato.style.display = 'block';
            divRisultato.innerHTML = `
                <div class="result-title">Profilo per ${nomeInput} (${anno})</div>
                <div class="result-section"><strong>Segno / Archetipo:</strong> ${profilo.segno}</div>
                <div class="result-section"><strong>Oroscopo & Tendenze:</strong> ${profilo.oroscopo}</div>
                <div class="result-section"><strong>Pietra Preziosa:</strong> ${profilo.pietra}</div>
                <div class="result-section"><strong>Colore Guida:</strong> ${profilo.colore}</div>
                <div class="result-section"><strong>Affinità Emozionale:</strong> ${profilo.affinita}</div>
                <div class="numbers-box">
                    Numeri Astrali: ${num1} - ${num2} - ${num3}
                </div>
            `;
        }
    </script>

</body>
</html>
