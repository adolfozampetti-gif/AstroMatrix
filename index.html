<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Tre Numeri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f9;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #risultato {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .error {
            color: #dc3545;
        }
    </style>
</head>
<body>

    <h2>Calcolo Tre Numeri</h2>

    <form id="numeriForm">
        <div class="form-group">
            <label for="nome">Nome o Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Es. Adolfo">
        </div>

        <div class="form-group">
            <label for="comune">Comune di Nascita:</label>
            <input type="text" id="comune" required placeholder="Es. Napoli">
        </div>

        <div class="form-group">
            <label for="anno">Anno di Nascita (YYYY):</label>
            <input type="number" id="anno" min="1900" max="2099" required placeholder="Es. 1955">
        </div>

        <button type="button" onclick="calcolaNumeri()">Calcola Numeri</button>
    </form>

    <div id="risultato"></div>

    <script>
        // Mappa dei valori associati ai comuni principali (espandibile)
        const databaseComuni = {
            "NAPOLI": 18,
            "CASERTA": 12,
            "SAVONA": 7,
            "UDINE": 15,
            "ROMA": 9,
            "MILANO": 5
        };

        function riduciA90(valore) {
            let res = valore % 90;
            return res === 0 ? 90 : res;
        }

        function calcolaValoreTesto(testo) {
            const lettere = testo.toUpperCase().replace(/[^A-Z]/g, '');
            let somma = 0;
            for (let i = 0; i < lettere.length; i++) {
                somma += (lettere.charCodeAt(i) - 64);
            }
            return somma;
        }

        function calcolaNumeri() {
            const nomeInput = document.getElementById('nome').value.trim();
            const comuneInput = document.getElementById('comune').value.trim();
            const annoInput = document.getElementById('anno').value.trim();
            const divRisultato = document.getElementById('risultato');

            // Validazione campi vuoti
            if (!nomeInput || !comuneInput || !annoInput) {
                divRisultato.innerHTML = '<span class="error">Compilare tutti i campi.</span>';
                return;
            }

            // Validazione anno
            const anno = parseInt(annoInput, 10);
            if (isNaN(anno) || anno < 1900 || anno > 2099) {
                divRisultato.innerHTML = '<span class="error">Inserire un anno di nascita valido a 4 cifre.</span>';
                return;
            }

            // Validazione e lookup comune
            const comuneKey = comuneInput.toUpperCase();
            let valoreComune = databaseComuni[comuneKey];

            if (valoreComune === undefined) {
                // Se il comune non è nel database fisso, calcola un valore dinamico coerente dal testo
                valoreComune = calcolaValoreTesto(comuneKey);
            }

            // Calcolo del valore del nome
            const valoreNome = calcolaValoreTesto(nomeInput);

            // Algoritmo di calcolo dei 3 numeri (range 1 - 90)
            const num1 = riduciA90(valoreNome + anno);
            const num2 = riduciA90(valoreComune + (anno % 100));
            const num3 = riduciA90(valoreNome + valoreComune + anno);

            divRisultato.innerHTML = `I tuoi tre numeri sono: <br><span style="color:#007bff; font-size:24px;">${num1} - ${num2} - ${num3}</span>`;
        }
    </script>

</body>
</html>
