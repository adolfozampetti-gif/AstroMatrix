<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroMatrix FREE - Dashboard Geodinamica</title>
    <!-- Font Awesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #131722;
            --input-bg: #1c2230;
            --border-color: #2a3245;
            --gold-primary: #f0b429;
            --gold-light: #f7d070;
            --gold-hover: #d99f1f;
            --text-main: #e6e8ec;
            --text-muted: #9aa5b5;
            --accent-red: #e53935;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .main-card {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand i {
            color: var(--accent-red);
            font-size: 26px;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-primary);
            letter-spacing: 2px;
        }

        .brand-sub {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            display: block;
        }

        .badge {
            background-color: rgba(240, 180, 41, 0.12);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .hero-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-title h1 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .hero-title p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 550px;
            margin: 0 auto;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-label i {
            margin-right: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px rgba(240, 180, 41, 0.3);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 580px) {
            .grid-3, .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .btn-calculate {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-primary), #c99018);
            color: #0b0d12;
            border: none;
            border-radius: 6px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(240, 180, 41, 0.2);
        }

        .btn-calculate:hover {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(240, 180, 41, 0.4);
        }

        /* Sezione Risultati */
        #output-container {
            display: none;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px dashed var(--border-color);
        }

        .result-card {
            background-color: var(--input-bg);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            padding: 25px;
        }

        .result-header {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: var(--gold-primary);
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .info-val {
            color: #ffffff;
            font-weight: 600;
            text-align: right;
        }

        .horoscope-box {
            background-color: rgba(11, 13, 18, 0.6);
            border-left: 3px solid var(--gold-primary);
            padding: 12px 15px;
            margin: 15px 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);
            font-style: italic;
        }

        .astral-numbers {
            background: linear-gradient(135deg, rgba(240, 180, 41, 0.15), rgba(240, 180, 41, 0.05));
            border: 1px solid var(--gold-primary);
            border-radius: 6px;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        .astral-numbers-title {
            font-size: 12px;
            color: var(--gold-primary);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .astral-numbers-val {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
        }

        .error-message {
            color: var(--accent-red);
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header-bar">
            <div class="brand">
                <i class="fa-solid fa-asterisk"></i>
                <div>
                    <span class="brand-title">ASTROMATRIX</span>
                    <span class="brand-sub">DASHBOARD GEODINAMICA</span>
                </div>
            </div>
            <div class="badge">FREE EDITION</div>
        </div>

        <div class="hero-title">
            <h1>IL TUO PROFILO ASTRALE</h1>
            <p>Inserisci nome, giorno, mese, anno, ora e città di nascita per generare l'analisi dettagliata estratta direttamente dal Master Geodinamico.</p>
        </div>

        <form id="astroForm">
            <div style="margin-bottom: 20px;">
                <label class="form-label" for="nome"><i class="fa-solid fa-user"></i> NOME</label>
                <input type="text" id="nome" class="form-control" placeholder="Inserisci il tuo nome" required>
            </div>

            <div class="grid-3">
                <div>
                    <label class="form-label" for="giorno"><i class="fa-solid fa-calendar-day"></i> GIORNO (1-31)</label>
                    <input type="number" id="giorno" class="form-control" min="1" max="31" placeholder="GG" required>
                </div>
                <div>
                    <label class="form-label" for="mese"><i class="fa-solid fa-calendar-alt"></i> MESE DI NASCITA</label>
                    <select id="mese" class="form-control" required>
                        <option value="">Seleziona</option>
                        <option value="1">Gennaio</option>
                        <option value="2">Febbraio</option>
                        <option value="3">Marzo</option>
                        <option value="4">Aprile</option>
                        <option value="5">Maggio</option>
                        <option value="6">Giugno</option>
                        <option value="7">Luglio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Settembre</option>
                        <option value="10">Ottobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Dicembre</option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="anno"><i class="fa-solid fa-calendar"></i> ANNO (AAAA)</label>
                    <input type="number" id="anno" class="form-control" min="1900" max="2026" placeholder="AAAA" required>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label class="form-label" for="ora"><i class="fa-solid fa-clock"></i> ORA DI NASCITA *</label>
                    <input type="text" id="ora" class="form-control" placeholder="Es. 16:30">
                </div>
                <div>
                    <label class="form-label" for="comune"><i class="fa-solid fa-location-dot"></i> CITTÀ / COMUNE DI NASCITA</label>
                    <input type="text" id="comune" class="form-control" placeholder="Es. Napoli" required>
                </div>
            </div>

            <button type="button" class="btn-calculate" onclick="elaboraAstroMatrix()">
                <i class="fa-solid fa-calculator"></i> CALCOLA PROFILO GRATUITO
            </button>
        </form>

        <div id="output-container">
            <div id="result-content"></div>
        </div>
    </div>

    <script>
        // Database esteso di Comuni e Coordinate Geodinamiche
        const databaseComuni = {
            "NAPOLI": 18, "CASERTA": 12, "SAVONA": 7, "UDINE": 15, "ROMA": 9, 
            "MILANO": 5, "TORINO": 6, "BOLOGNA": 11, "FIRENZE": 14, "PALERMO": 21,
            "GENOVA": 8, "BARI": 19, "CATANIA": 23, "VENEZIA": 13, "VERONA": 10,
            "MESSINA": 22, "PADOVA": 13, "TRIESTE": 16, "TARANTO": 20, "BRESCIA": 8
        };

        // Tabella dei Segni Zodiacali con Pietre, Colori, Affinità e Profili
        const mappaZodiacale = [
            { segno: "Capricorno", inizio: [12, 22], fine: [1, 19], pietra: "Rubino", colore: "Nero / Grigio Antracite", affinita: "Toro e Vergine", oroscopo: "La concretezza e la determinazione ferrea ti permettono di superare qualsiasi vetta. La pazienza è il tuo talento cosmico principale." },
            { segno: "Acquario", inizio: [1, 20], fine: [2, 18], pietra: "Ametista", colore: "Blu Elettrico", affinita: "Gemelli e Bilancia", oroscopo: "Spirito libero e visione pionieristica del futuro. Sei guidato dall'innovazione e dalla ricerca di nuove prospettive." },
            { segno: "Pesci", inizio: [2, 19], fine: [3, 20], pietra: "Acquamarina", colore: "Verde Acqua / Smeraldo", affinita: "Cancro e Scorpione", oroscopo: "Grande intuito empatico e sensibilità artistica. Percepisci il mondo visibile e invisibile con rara profondità emotiva." },
            { segno: "Ariete", inizio: [3, 21], fine: [4, 19], pietra: "Diamante", colore: "Rosso Fuoco", affinita: "Leone e Sagittario", oroscopo: "Carica vitale trascinante e coraggio di intraprendere nuove sfide. Il tuo impulso naturale spezza ogni resistenza." },
            { segno: "Toro", inizio: [4, 20], fine: [5, 20], pietra: "Smeraldo", colore: "Verde Foresta", affinita: "Vergine e Capricorno", oroscopo: "Amore per la stabilità, il senso della terra e l'armonia estetica. Costruisci con costanza risultati solidi e durevoli." },
            { segno: "Gemelli", inizio: [5, 21], fine: [6, 20], pietra: "Agata", colore: "Giallo Solare", affinita: "Bilancia e Acquario", oroscopo: "Mente vivace, curiosità inesauribile e grande prontezza comunicativa. Trasformi le idee in progetti dinamici." },
            { segno: "Cancro", inizio: [6, 21], fine: [7, 22], pietra: "Perla", colore: "Bianco Perla / Argento", affinita: "Scorpione e Pesci", oroscopo: "Legame profondo con le origini, le memorie e la famiglia. La tua forza risiede nell'intuizione e nella protezione." },
            { segno: "Leone", inizio: [7, 23], fine: [8, 22], pietra: "Topazio", colore: "Oro / Arancione Vivo", affinita: "Ariete e Sagittario", oroscopo: "Naturale carisma, generosità di cuore e presenza autorevole. Attrai opportunità grazie alla tua energia radiosa." },
            { segno: "Vergine", inizio: [8, 23], fine: [9, 22], pietra: "Zaffiro", colore: "Marrone Cobalto / Blu Scuro", affinita: "Toro e Capricorno", oroscopo: "Precisione, spirito d'analisi e meticolosità raffinata. Sai trovare ordine ed efficienza anche nelle situazioni complesse." },
            { segno: "Bilancia", inizio: [9, 23], fine: [10, 22], pietra: "Opale", colore: "Rosa / Celeste", affinita: "Gemelli e Acquario", oroscopo: "Ricerca costante dell'equilibrio, del bello e della giustizia. La tua diplomazia trasforma i conflitti in accordi ideali." },
            { segno: "Scorpione", inizio: [10, 23], fine: [11, 21], pietra: "Topazio Scuro", colore: "Rosso Porpora / Nero", affinita: "Cancro e Pesci", oroscopo: "Magnetismo profondo, passione ed elevata capacità di rigenerazione. Penetri oltre la superficie delle cose." },
            { segno: "Sagittario", inizio: [11, 22], fine: [12, 21], pietra: "Turchese", colore: "Blu Intenso / Viola", affinita: "Ariete e Leone", oroscopo: "Grande ottimismo, amore per la conoscenza e lo spirito d'avventura. Il tuo sguardo è sempre rivolto verso ampi orizzonti." }
        ];

        function riduciA90(valore) {
            let res = valore % 90;
            return res === 0 ? 90 : res;
        }

        function calcolaValoreTesto(testo) {
            const lettere = testo.toUpperCase().replace(/[^A-Z]/g, '');
            let somma = 0;
            for (let i = 0; i < lettere.length; i++) {
                somma += (lettere.charCodeAt(i) - 64);
            }
            return somma || 1;
        }

        function determinaSegnoZodiacale(giorno, mese) {
            g = parseInt(giorno, 10);
            m = parseInt(mese, 10);
            
            for (let item of mappaZodiacale) {
                let [mInizio, gInizio] = item.inizio;
                let [mFine, gFine] = item.fine;
                
                if ((m === mInizio && g >= gInizio) || (m === mFine && g <= gFine)) {
                    return item;
                }
            }
            return mappaZodiacale[0]; // Capricorno come fallback
        }

        function elaboraAstroMatrix() {
            const nome = document.getElementById('nome').value.trim();
            const giorno = document.getElementById('giorno').value.trim();
            const mese = document.getElementById('mese').value.trim();
            const anno = document.getElementById('anno').value.trim();
            const ora = document.getElementById('ora').value.trim();
            const comune = document.getElementById('comune').value.trim();
            
            const container = document.getElementById('output-container');
            const resultContent = document.getElementById('result-content');

            if (!nome || !giorno || !mese || !anno || !comune) {
                container.style.display = 'block';
                resultContent.innerHTML = '<div class="error-message"><i class="fa-solid fa-triangle-exclamation"></i> Si prega di compilare tutti i campi obbligatori del form.</div>';
                return;
            }

            const gNum = parseInt(giorno, 10);
            const mNum = parseInt(mese, 10);
            const aNum = parseInt(anno, 10);

            if (gNum < 1 || gNum > 31 || aNum < 1900 || aNum > 2026) {
                container.style.display = 'block';
                resultContent.innerHTML = '<div class="error-message"><i class="fa-solid fa-triangle-exclamation"></i> Inserire una data di nascita valida.</div>';
                return;
            }

            // Lookup o Calcolo Dinamico del Comune
            const comuneUpper = comune.toUpperCase();
            let valoreComune = databaseComuni[comuneUpper];
            if (valoreComune === undefined) {
                valoreComune = calcolaValoreTesto(comuneUpper);
            }

            const valoreNome = calcolaValoreTesto(nome);

            // Algoritmo Geodinamico dei 3 Numeri Astrali
            const num1 = riduciA90(valoreNome + aNum + gNum);
            const num2 = riduciA90(valoreComune + (aNum % 100) + mNum);
            const num3 = riduciA90(valoreNome + valoreComune + aNum + gNum + mNum);

            // Recupero Dati Zodiacali
            const profilo = determinaSegnoZodiacale(gNum, mNum);

            // Generazione del Layout del Profilo Completo
            container.style.display = 'block';
            resultContent.innerHTML = `
                <div class="result-card">
                    <div class="result-header">PROFILO GEODINAMICO DI ${nome.toUpperCase()}</div>
                    
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-user-tag"></i> Data & Ora:</span>
                        <span class="info-val">${gNum}/${mNum}/${aNum} ${ora ? 'alle ' + ora : ''}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-city"></i> Luogo di Nascita:</span>
                        <span class="info-val">${comune.toUpperCase()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-star"></i> Segno Zodiacale:</span>
                        <span class="info-val" style="color: var(--gold-primary); font-size: 16px;">${profilo.segno}</span>
                    </div>
                    
                    <div class="horoscope-box">
                        "${profilo.oroscopo}"
                    </div>

                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-gem"></i> Pietra Preziosa:</span>
                        <span class="info-val">${profilo.pietra}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-palette"></i> Colore Guida:</span>
                        <span class="info-val">${profilo.colore}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-heart"></i> Affinità Emozionale:</span>
                        <span class="info-val">${profilo.affinita}</span>
                    </div>

                    <div class="astral-numbers">
                        <div class="astral-numbers-title">NUMERI ASTRALI GEODINAMICI</div>
                        <div class="astral-numbers-val">${num1} - ${num2} - ${num3}</div>
                    </div>
                </div>
            `;

            // Scorrimento fluido verso i risultati
            container.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
