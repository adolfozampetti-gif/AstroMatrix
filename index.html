<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroMatrix FREE - Dashboard Geodinamica</title>
    <!-- Font Awesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #131722;
            --input-bg: #1c2230;
            --border-color: #2a3245;
            --gold-primary: #f0b429;
            --gold-light: #f7d070;
            --gold-hover: #d99f1f;
            --text-main: #e6e8ec;
            --text-muted: #9aa5b5;
            --accent-red: #e53935;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .main-card {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand i {
            color: var(--accent-red);
            font-size: 26px;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-primary);
            letter-spacing: 2px;
        }

        .brand-sub {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            display: block;
        }

        .badge {
            background-color: rgba(240, 180, 41, 0.12);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .hero-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-title h1 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .hero-title p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 550px;
            margin: 0 auto;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-label i {
            margin-right: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px rgba(240, 180, 41, 0.3);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 580px) {
            .grid-3, .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .btn-calculate {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-primary), #c99018);
            color: #0b0d12;
            border: none;
            border-radius: 6px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(240, 180, 41, 0.2);
        }

        .btn-calculate:hover {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(240, 180, 41, 0.4);
        }

        /* Sezione Risultati */
        #output-container {
            display: none;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px dashed var(--border-color);
        }

        .result-card {
            background-color: var(--input-bg);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            padding: 25px;
        }

        .result-header {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: var(--gold-primary);
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .info-val {
            color: #ffffff;
            font-weight: 600;
            text-align: right;
        }

        .horoscope-box {
            background-color: rgba(11, 13, 18, 0.6);
            border-left: 3px solid var(--gold-primary);
            padding: 12px 15px;
            margin: 15px 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);
            font-style: italic;
        }

        .astral-numbers {
            background: linear-gradient(135deg, rgba(240, 180, 41, 0.15), rgba(240, 180, 41, 0.05));
            border: 1px solid var(--gold-primary);
            border-radius: 6px;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        .astral-numbers-title {
            font-size: 12px;
            color: var(--gold-primary);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .astral-numbers-val {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
        }

        .error-message {
            color: var(--accent-red);
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header-bar">
            <div class="brand">
                <i class="fa-solid fa-asterisk"></i>
                <div>
                    <span class="brand-title">ASTROMATRIX</span>
                    <span class="brand-sub">DASHBOARD GEODINAMICA</span>
                </div>
            </div>
            <div class="badge">FREE EDITION</div>
        </div>

        <div class="hero-title">
            <h1>IL TUO PROFILO ASTRALE</h1>
            <p>Inserisci nome, giorno, mese, anno, ora e città di nascita per generare l'analisi dettagliata estratta direttamente dal Master Geodinamico.</p>
        </div>

        <form id="astroForm">
            <div style="margin-bottom: 20px;">
                <label class="form-label" for="nome"><i class="fa-solid fa-user"></i> NOME</label>
                <input type="text" id="nome" class="form-control" placeholder="Inserisci il tuo nome (es. Adolfo)" required>
            </div>

            <div class="grid-3">
                <div>
                    <label class="form-label" for="giorno"><i class="fa-solid fa-calendar-day"></i> GIORNO (1-31)</label>
                    <input type="number" id="giorno" class="form-control" min="1" max="31" placeholder="GG" required>
                </div>
                <div>
                    <label class="form-label" for="mese"><i class="fa-solid fa-calendar-alt"></i> MESE DI NASCITA</label>
                    <select id="mese" class="form-control" required>
                        <option value="">Seleziona</option>
                        <option value="1">Gennaio</option>
                        <option value="2">Febbraio</option>
                        <option value="3">Marzo</option>
                        <option value="4">Aprile</option>
                        <option value="5">Maggio</option>
                        <option value="6">Giugno</option>
                        <option value="7">Luglio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Settembre</option>
                        <option value="10">Ottobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Dicembre</option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="anno"><i class="fa-solid fa-calendar"></i> ANNO (AAAA)</label>
                    <input type="number" id="anno" class="form-control" min="1900" max="2026" placeholder="AAAA" required>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label class="form-label" for="ora"><i class="fa-solid fa-clock"></i> ORA DI NASCITA *</label>
                    <input type="text" id="ora" class="form-control" placeholder="Es. 16:30">
                </div>
                <div>
                    <label class="form-label" for="comune"><i class="fa-solid fa-location-dot"></i> CITTÀ / COMUNE DI NASCITA</label>
                    <input type="text" id="comune" class="form-control" placeholder="Es. Napoli" required>
                </div>
            </div>

            <button type="button" class="btn-calculate" onclick="elaboraAstroMatrix()">
                <i class="fa-solid fa-calculator"></i> CALCOLA PROFILO GRATUITO
            </button>
        </form>

        <div id="output-container">
            <div id="result-content"></div>
        </div>
    </div>

    <script>
        // Database dei Comuni e Coordinate Geodinamiche (flessibile e dinamico)
        const databaseComuni = {
            "NAPOLI": 18, "CASERTA": 12, "SAVONA": 7, "UDINE": 15, "ROMA": 9, 
            "MILANO": 5, "TORINO": 6, "BOLOGNA": 11, "FIRENZE": 14, "PALERMO": 21,
            "GENOVA": 8, "BARI": 19, "CATANIA": 23, "VENEZIA": 13, "VERONA": 10
        };

        // Database dei Nomi integrato (Significato, Onomastico, Aneddoto, Famosi)
        const databaseNomi = {
            "ADALGISA": { significato: "Nome di origine germanica, di nobile ostaggio o nobile protezione.", onomastico: "20 Aprile", aneddoto: "Una sera a teatro a Milano, una signora di nome Adalgisa fu scambiata per la soprano della Norma di Bellini e ricevette un applauso spontaneo.", famosi: "Adalgisa Gabbi" },
            "ADAMO": { significato: "Nome di origine ebraica, significa uomo, nato dalla terra.", onomastico: "24 Dicembre", aneddoto: "Durante un viaggio in campagna, Adamo perse la strada ma trovò un frutteto selvatico; da allora ovunque vada ritrova il suo giardino.", famosi: "Adamo (personaggio biblico)" },
            "ADAUTO": { significato: "Nome di origine latina, significa aggiunto, nato in più.", onomastico: "30 Agosto", aneddoto: "Nato come quinto figlio in una famiglia numerosa, Adauto portò sempre con orgoglio questo nome unico.", famosi: "Sant'Adauto" },
            "ADALBERTO": { significato: "Nome di origine germanica, significa di illustre nobiltà.", onomastico: "23 Aprile", aneddoto: "Un giovane Adalberto ristrutturò una vecchia libreria di famiglia trasformandola in punto di incontro per poeti.", famosi: "Adalberto da Praga" },
            "ADELAIDE": { significato: "Nome di origine germanica, significa di nobile stirpe e aspetto.", onomastico: "16 Dicembre", aneddoto: "Nonna Adelaide amava raccontare storie attorno al camino, trasformando ogni serata d'inverno in un racconto.", famosi: "Adelaide Ristori" },
            "ADOLFO": { significato: "Nome di origine germanica, significa nobile lupo.", onomastico: "17 Giugno", aneddoto: "Nelle notti estive degli anni '70, un giovane DJ di nome Adolfo infiammava le frequenze delle prime radio libere campane.", famosi: "Adolfo Celi, Adolfo Zampetti" },
            "ADRIANO": { significato: "Nome di origine latina, significa originario di Adria o proveniente dal mare.", onomastico: "9 Gennaio, 5 Marzo, 8 Luglio", aneddoto: "Durante un viaggio a Roma, Adriano si fermò davanti a Castel Sant'Angelo riflettendo sulla storia dell'impero.", famosi: "Imperatore Adriano, Adriano Celentano" },
            "AGAPITO": { significato: "Nome di origine greca, significa amato, amabile.", onomastico: "18 Agosto", aneddoto: "Agapito era conosciuto in tutto il paese per il suo sorriso contagioso e la capacità di far pace tra i vicini.", famosi: "Papa Agapito I" },
            "AGATA": { significato: "Nome di origine greca, significa buona, virtuosa.", onomastico: "5 Febbraio, 12 Giugno", aneddoto: "Ogni anno a febbraio, Agata preparava le tradizionali ricette della nonna profumando l'intera strada.", famosi: "Sant'Agata, Agatha Christie" },
            "AGNESE": { significato: "Nome di origine greca, significa casta, pura, agnello.", onomastico: "21 Gennaio", aneddoto: "Nel giardino di Agnese crescevano le rose più profumate del paese, regalate ogni domenica agli anziani.", famosi: "Sant'Agnese, Agnese Moro" },
            "AGOSTINO": { significato: "Nome di origine latina, significa venerabile, favorito da auguri felici.", onomastico: "28 Agosto", aneddoto: "Tra gli scaffali della biblioteca universitaria, Agostino ritrovò un antico manoscritto sulla filosofia.", famosi: "Sant'Agostino d'Ippona" },
            "ALBERTO": { significato: "Nome di origine germanica, significa famoso per nobiltà.", onomastico: "8 Aprile", aneddoto: "Un regalo inaspettato aprì ad Alberto un mondo nuovo fatto di scrittura, blog e programmazione web.", famosi: "Alberto Sordi, Albert Einstein" },
            "ALDO": { significato: "Nome di origine germanica, significa vecchio, saggio, esperto.", onomastico: "10 Gennaio", aneddoto: "Nel suo laboratorio di falegnameria, Aldo creava burattini in legno capaci di incantare i bambini.", famosi: "Aldo Moro, Aldo Fabrizi" },
            "ALESSANDRA": { significato: "Nome di origine greca, significa protettrice degli uomini.", onomastico: "20 Marzo", aneddoto: "Alessandra corse la sua prima maratona tagliando il traguardo tra gli applausi commossi della famiglia.", famosi: "Alessandra Amoroso" },
            "ALESSANDRO": { significato: "Nome di origine greca, significa protettore degli uomini.", onomastico: "26 Febbraio, 26 Agosto", aneddoto: "Zio Alessandro amava guidare lungo la costa raccontando aneddoti storici su ogni baia.", famosi: "Alessandro Manzoni, Alessandro Del Piero" },
            "ALESSIO": { significato: "Nome di origine greca, significa colui che protegge o salva.", onomastico: "17 Febbraio, 17 Luglio", aneddoto: "Durante un forte temporale, Alessio trasse in salvo un gattino smarrito sotto una panchina.", famosi: "Alessio Boni" },
            "ALFONSO": { significato: "Nome di origine germanica, significa nobile e valoroso.", onomastico: "1 Agosto", aneddoto: "Don Alfonso curava la sua trattoria di campagna con la dedizione di un maestro d'orchestra.", famosi: "Sant'Alfonso Maria de' Liguori" },
            "AMEDEO": { significato: "Nome di origine latina, significa colui che ama Dio.", onomastico: "30 Marzo", aneddoto: "Amedeo scalò la sua prima cima dolomitica all'alba ammirando i riflessi rosa delle rocce.", famosi: "Amedeo Modigliani, Amedeo Nazzari" },
            "AMBROGIO": { significato: "Nome di origine greca, significa immortale.", onomastico: "7 Dicembre", aneddoto: "A Milano per Ambrogio è festa grande con le bancarelle degli Oh Bej! Oh Bej! e il vin brûlé.", famosi: "Sant'Ambrogio" },
            "ANTONIO": { significato: "Nome di origine latina, significa inestimabile.", onomastico: "17 Gennaio, 13 Giugno", aneddoto: "A giugno per la festa di Sant'Antonio, Antonio portava in processione la statua lungo le stradine del borgo.", famosi: "Sant'Antonio da Padova, Totò" }
        };

        const mappaZodiacale = [
            { segno: "Capricorno", inizio: [12, 22], fine: [1, 19], pietra: "Rubino", colore: "Nero / Grigio Antracite", affinita: "Toro e Vergine", oroscopo: "La concretezza e la determinazione ferrea ti permettono di superare qualsiasi vetta." },
            { segno: "Acquario", inizio: [1, 20], fine: [2, 18], pietra: "Ametista", colore: "Blu Elettrico", affinita: "Gemelli e Bilancia", oroscopo: "Spirito libero e visione pionieristica del futuro. Sei guidato dall'innovazione." },
            { segno: "Pesci", inizio: [2, 19], fine: [3, 20], pietra: "Acquamarina", colore: "Verde Acqua / Smeraldo", affinita: "Cancro e Scorpione", oroscopo: "Grande intuito empatico e sensibilità artistica di profonda intensità." },
            { segno: "Ariete", inizio: [3, 21], fine: [4, 19], pietra: "Diamante", colore: "Rosso Fuoco", affinita: "Leone e Sagittario", oroscopo: "Carica vitale trascinante e coraggio di intraprendere nuove sfide." },
            { segno: "Toro", inizio: [4, 20], fine: [5, 20], pietra: "Smeraldo", colore: "Verde Foresta", affinita: "Vergine e Capricorno", oroscopo: "Amore per la stabilità, il senso della terra e l'armonia estetica duratura." },
            { segno: "Gemelli", inizio: [5, 21], fine: [6, 20], pietra: "Agata", colore: "Giallo Solare", affinita: "Bilancia e Acquario", oroscopo: "Mente vivace, curiosità inesauribile e grande prontezza comunicativa." },
            { segno: "Cancro", inizio: [6, 21], fine: [7, 22], pietra: "Perla", colore: "Bianco Perla / Argento", affinita: "Scorpione e Pesci", oroscopo: "Legame profondo con le origini, le memorie e la famiglia protettiva." },
            { segno: "Leone", inizio: [7, 23], fine: [8, 22], pietra: "Topazio", colore: "Oro / Arancione Vivo", affinita: "Ariete e Sagittario", oroscopo: "Naturale carisma, generosità di cuore e presenza autorevole e radiosa." },
            { segno: "Vergine", inizio: [8, 23], fine: [9, 22], pietra: "Zaffiro", colore: "Marrone Cobalto / Blu Scuro", affinita: "Toro e Capricorno", oroscopo: "Precisione, spirito d'analisi e meticolosità raffinata ed efficiente." },
            { segno: "Bilancia", inizio: [9, 23], fine: [10, 22], pietra: "Opale", colore: "Rosa / Celeste", affinita: "Gemelli e Acquario", oroscopo: "Ricerca costante dell'equilibrio, del bello e della diplomazia ideale." },
            { segno: "Scorpione", inizio: [10, 23], fine: [11, 21], pietra: "Topazio Scuro", colore: "Rosso Porpora / Nero", affinita: "Cancro e Pesci", oroscopo: "Magnetismo profondo, passione ed elevata capacità di rigenerazione interiore." },
            { segno: "Sagittario", inizio: [11, 22], fine: [12, 21], pietra: "Turchese", colore: "Blu Intenso / Viola", affinita: "Ariete e Leone", oroscopo: "Grande ottimismo, amore per la conoscenza e lo spirito d'avventura cosmica." }
        ];

        function riduciA90(valore) {
            let res = valore % 90;
            return res === 0 ? 90 : res;
        }

        function calcolaValoreTesto(testo) {
            const lettere = testo.toUpperCase().replace(/[^A-Z]/g, '');
            let somma = 0;
            for (let i = 0; i < lettere.length; i++) {
                somma += (lettere.charCodeAt(i) - 64);
            }
            return somma || 1;
        }

        function determinaSegnoZodiacale(giorno, mese) {
            let g = parseInt(giorno, 10);
            let m = parseInt(mese, 10);
            
            for (let item of mappaZodiacale) {
                let [mInizio, gInizio] = item.inizio;
                let [mFine, gFine] = item.fine;
                
                if ((m === mInizio && g >= gInizio) || (m === mFine && g <= gFine)) {
                    return item;
                }
            }
            return mappaZodiacale[0];
        }

        function elaboraAstroMatrix() {
            const nomeInput = document.getElementById('nome').value.trim();
            const giorno = document.getElementById('giorno').value.trim();
            const mese = document.getElementById('mese').value.trim();
            const anno = document.getElementById('anno').value.trim();
            const ora = document.getElementById('ora').value.trim();
            const comune = document.getElementById('comune').value.trim();
            
            const container = document.getElementById('output-container');
            const resultContent = document.getElementById('result-content');

            if (!nomeInput || !giorno || !mese || !anno || !comune) {
                container.style.display = 'block';
                resultContent.innerHTML = '<div class="error-message"><i class="fa-solid fa-triangle-exclamation"></i> Si prega di compilare tutti i campi obbligatori del form.</div>';
                return;
            }

            const gNum = parseInt(giorno, 10);
            const mNum = parseInt(mese, 10);
            const aNum = parseInt(anno, 10);

            if (gNum < 1 || gNum > 31 || aNum < 1900 || aNum > 2026) {
                container.style.display = 'block';
                resultContent.innerHTML = '<div class="error-message"><i class="fa-solid fa-triangle-exclamation"></i> Inserire una data di nascita valida.</div>';
                return;
            }

            // Comune lookup
            const comuneUpper = comune.toUpperCase();
            let valoreComune = databaseComuni[comuneUpper];
            if (valoreComune === undefined) {
                valoreComune = calcolaValoreTesto(comuneUpper);
            }

            const valoreNome = calcolaValoreTesto(nomeInput);

            // Numeri Astrali
            const num1 = riduciA90(valoreNome + aNum + gNum);
            const num2 = riduciA90(valoreComune + (aNum % 100) + mNum);
            const num3 = riduciA90(valoreNome + valoreComune + aNum + gNum + mNum);

            // Profilo Zodiacale
            const profilo = determinaSegnoZodiacale(gNum, mNum);

            // Cerca nel database dei nomi (estraendo il primo nome se composto)
            const primoNome = nomeInput.split(' ')[0].toUpperCase();
            let infoNome = databaseNomi[primoNome];
            
            // Se non trovato esattamente, genera info coerenti
            if (!infoNome) {
                infoNome = {
                    significato: `Nome di tradizione storica e culturale, legato all'espressione della personalità e dell'identità personale.`,
                    onomastico: "1 Novembre (Tutti i Santi)",
                    aneddoto: `Nel corso della sua vita, ${nomeInput} ha sempre dimostrato grande intraprendenza, lasciando un ricordo speciale in chi lo circonda.`,
                    famosi: "Personalità storiche e contemporanee"
                };
            }

            // Mostra Risultato
            container.style.display = 'block';
            resultContent.innerHTML = `
                <div class="result-card">
                    <div class="result-header">PROFILO GEODINAMICO DI ${nomeInput.toUpperCase()}</div>
                    
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-user-tag"></i> Data & Ora:</span>
                        <span class="info-val">${gNum}/${mNum}/${aNum} ${ora ? 'alle ' + ora : ''}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-city"></i> Luogo di Nascita:</span>
                        <span class="info-val">${comune.toUpperCase()}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-star"></i> Segno Zodiacale:</span>
                        <span class="info-val" style="color: var(--gold-primary); font-size: 16px;">${profilo.segno}</span>
                    </div>
                    
                    <div class="horoscope-box">
                        "${profilo.oroscopo}"
                    </div>

                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-gem"></i> Pietra Preziosa:</span>
                        <span class="info-val">${profilo.pietra}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-palette"></i> Colore Guida:</span>
                        <span class="info-val">${profilo.colore}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label"><i class="fa-solid fa-heart"></i> Affinità Emozionale:</span>
                        <span class="info-val">${profilo.affinita}</span>
                    </div>

                    <!-- Sezione Anagrafica Nome & Onomastico integrata dall'Excel -->
                    <div style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                        <div class="info-row">
                            <span class="info-label"><i class="fa-solid fa-book"></i> Significato Nome:</span>
                            <span class="info-val" style="text-align: left; max-width: 60%;">${infoNome.significato}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fa-solid fa-calendar-check"></i> Data Onomastico:</span>
                            <span class="info-val">${infoNome.onomastico}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fa-solid fa-feather"></i> Storia / Aneddoto:</span>
                            <span class="info-val" style="text-align: left; max-width: 60%; font-style: italic;">"${infoNome.aneddoto}"</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fa-solid fa-award"></i> Omonimi Famosi:</span>
                            <span class="info-val">${infoNome.famosi}</span>
                        </div>
                    </div>

                    <div class="astral-numbers">
                        <div class="astral-numbers-title">NUMERI ASTRALI GEODINAMICI</div>
                        <div class="astral-numbers-val">${num1} - ${num2} - ${num3}</div>
                    </div>
                </div>
            `;

            container.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
