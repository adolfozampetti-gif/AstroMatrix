<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroMatrix FREE - Dashboard Astrologica & Geodinamica</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#f59e0b',
                            dark: '#020617',
                            card: '#090d16',
                            border: '#1e293b'
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .glass-card { background: rgba(9, 13, 22, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(245, 158, 11, 0.2); }
        .glow-gold { box-shadow: 0 0 35px -5px rgba(245, 158, 11, 0.3); }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(100%) sepia(50%) saturate(1000%) hue-rotate(340deg);
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

    <!-- Top Header Navigation -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center shadow-lg shadow-amber-500/20">
                    <i class="fa-solid fa-star-of-life text-slate-950 text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-amber-400 font-cinzel leading-tight">
                        AstroMatrix
                    </h1>
                    <span class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">Dashboard Geodinamica</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="text-xs bg-amber-500/10 text-amber-300 px-3 py-1 rounded-full border border-amber-500/30 font-semibold tracking-wide">
                    <i class="fa-solid fa-gift mr-1 text-amber-400"></i>FREE EDITION
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-3xl mx-auto p-4 sm:p-6 w-full flex-grow my-6">
        
        <!-- Hero Intro Section -->
        <div class="text-center mb-8">
            <h2 class="text-3xl sm:text-4xl font-bold mb-3 text-amber-200 font-cinzel tracking-wide">
                Il Tuo Profilo Astrale Completo
            </h2>
            <p class="text-slate-400 text-sm sm:text-base max-w-lg mx-auto">
                Inserisci nome, giorno, mese, anno, ora e città di nascita per generare l'analisi dettagliata estratta direttamente dal Master Geodinamico.
            </p>
        </div>

        <!-- Input Form Card -->
        <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl mb-8 glow-gold">
            <div class="space-y-5">
                
                <!-- 1. Campo Nome -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-amber-400/80 mb-2">
                        <i class="fa-solid fa-user mr-1.5"></i>Nome
                    </label>
                    <input type="text" id="userName" placeholder="Es. Monica" value="Monica"
                        class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all text-base">
                </div>

                <!-- 2. Campi Data: Giorno, Mese, Anno -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-amber-400/80 mb-2">
                            <i class="fa-solid fa-calendar-day mr-1.5"></i>Giorno (1-31)
                        </label>
                        <input type="number" id="userDay" min="1" max="31" placeholder="Es. 24" value="24"
                            class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-all text-base">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-amber-400/80 mb-2">
                            <i class="fa-solid fa-calendar-days mr-1.5"></i>Mese di Nascita
                        </label>
                        <select id="userMonth" class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-amber-500 transition-all text-base">
                            <option value="1">Gennaio</option>
                            <option value="2">Febbraio</option>
                            <option value="3">Marzo</option>
                            <option value="4">Aprile</option>
                            <option value="5">Maggio</option>
                            <option value="6">Giugno</option>
                            <option value="7">Luglio</option>
                            <option value="8">Agosto</option>
                            <option value="9">Settembre</option>
                            <option value="10">Ottobre</option>
                            <option value="11">Novembre</option>
                            <option value="12" selected>Dicembre</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-amber-400/80 mb-2">
                            <i class="fa-solid fa-calendar mr-1.5"></i>Anno (AAAA)
                        </label>
                        <input type="number" id="userYear" min="1900" max="2026" placeholder="Es. 1959" value="1959"
                            class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-all text-base">
                    </div>
                </div>

                <!-- 3. Campi Ora e Città di Nascita (Ora Menù a Tendina) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-amber-400/80 mb-2">
                            <i class="fa-solid fa-clock mr-1.5"></i>Ora di Nascita <span class="text-amber-400">*</span>
                        </label>
                        <input type="time" id="userTime" value="20:00"
                            class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-amber-500 transition-all text-base">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-amber-400/80 mb-2">
                            <i class="fa-solid fa-location-dot mr-1.5"></i>Città di Nascita
                        </label>
                        <select id="userPlace" class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-amber-500 transition-all text-base">
                            <option value="Napoli" selected>Napoli</option>
                            <option value="Caserta">Caserta</option>
                            <option value="Roma">Roma</option>
                            <option value="Milano">Milano</option>
                            <option value="Torino">Torino</option>
                            <option value="Firenze">Firenze</option>
                            <option value="Bologna">Bologna</option>
                            <option value="Palermo">Palermo</option>
                            <option value="Bari">Bari</option>
                            <option value="Salerno">Salerno</option>
                        </select>
                    </div>
                </div>

                <!-- Action Button -->
                <button type="button" onclick="calculateMatrix()" class="w-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-600 hover:from-a
