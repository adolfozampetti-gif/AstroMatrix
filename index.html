<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroMatrix - Dashboard Geodinamica</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --border-color: #30363d;
            --gold-primary: #f0b429;
            --gold-hover: #d99f1f;
            --text-main: #c9d1d9;
            --text-light: #8b949e;
            --accent-red: #da3633;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            color: var(--accent-red);
            font-size: 24px;
            font-weight: bold;
        }

        .logo-text {
            color: var(--gold-primary);
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .badge-free {
            background-color: rgba(240, 180, 41, 0.1);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .title-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .title-section h1 {
            color: #ffffff;
            font-size: 26px;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        .title-section p {
            color: var(--text-light);
            font-size: 13px;
            margin: 0;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--gold-primary);
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            background-color: #0d0f12;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold-primary);
        }

        .row-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 15px;
        }

        .row-double {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .row-grid, .row-double {
                grid-template-columns: 1fr;
            }
        }

        .btn-submit {
            width: 100%;
            background-color: var(--gold-primary);
            color: #0d0f12;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--gold-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        #risultato {
            margin-top: 25px;
            background-color: #0d0f12;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: none;
        }

        .result-title {
            color: var(--gold-primary);
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .result-item {
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .result-item strong {
            color: #ffffff;
        }

        .numbers-box {
            background: rgba(240, 180, 41, 0.08);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            letter-spacing: 2px;
        }

        .error-msg {
            color: var(--accent-red);
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-area">
                <span class="logo-icon">✶</span>
                <span class="logo-text">ASTROMATRIX</span>
            </div>
            <div class="badge-free">FREE EDITION</div>
        </div>

        <div class="title-section">
            <h1>IL TUO PROFILO ASTRALE</h1>
            <p>Inserisci nome, giorno, mese, anno, ora e città di nascita per generare l'analisi dettagliata estratta direttamente dal Master Geodinamico.</p>
        </div>

        <form id="astromatrixForm">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" required placeholder="Es. Monica">
            </div>

            <div class="row-grid">
                <div class="form-group">
                    <label for="giorno">Giorno (1-31)</label>
                    <input type="number" id="giorno" min="1" max="31" required placeholder="29">
                </div>
                <div class="form-group">
                    <label for="mese">Mese di Nascita</label>
                    <select id="mese" required>
                        <option value="">Seleziona</option>
                        <option value="1">Gennaio</option>
                        <option value="2">Febbraio</option>
                        <option value="3" selected>Marzo</option>
                        <option value="4">Aprile</option>
                        <option value="5">Maggio</option>
                        <option value="6">Giugno</option>
                        <option value="7">Luglio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Settembre</option>
                        <option value="10">Ottobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Dicembre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="anno">Anno (AAAA)</label>
                    <input type="number" id="anno" min="1900" max="2026" required placeholder="1956">
                </div>
            </div>

            <div class="row-double">
                <div class="form-group">
                    <label for="ora">Ora di Nascita *</label>
                    <input type="text" id="ora" placeholder="Es. 16:00">
                </div>
                <div class="form-group">
                    <label for="comune">Città / Comune di Nascita</label>
                    <input type="text" id="comune" required placeholder="Napoli">
                </div>
            </div>

            <button type="button" class="btn-submit" onclick="calcolaProfiloAstro()">% Calcola Profilo Gratuito</button>
        </form>

        <div id="risultato"></div>
    </div>

    <script>
        const databaseComuni = {
            "NAPOLI": 18, "CASERTA": 12, "SAVONA": 7, "UDINE": 15,
            "ROMA": 9, "MILANO": 5, "TORINO": 6, "BOLOGNA": 11, "FIRENZE": 14
        };

        const datiZodiacali = [
            { segno: "Capricorno", pietra: "Rubino", colore: "Nero / Grigio", affinita: "Toro e Vergine", oroscopo: "La concretezza e la determinazione guidano ogni passo verso traguardi di grande valore." },
            { segno: "Acquario", pietra: "Ametista", colore: "Blu Elettrico", affinita: "Gemelli e Bilancia", oroscopo: "Originalità e visione del futuro aprono nuove e inattese strade evolutive." },
            { segno: "Pesci", pietra: "Acquamarina", colore: "Verde Acqua", affinita: "Cancro e Scorpione", oroscopo: "L'intuito profondo e la sensibilità guidano le scelte con ispirazione creativa." },
            { segno: "Ariete", pietra: "Diamante", colore: "Rosso Fuoco", affinita: "Leone e Sagittario", oroscopo: "L'energia vitale e lo spirito pionieristico superano brillantemente qualsiasi ostacolo." },
            { segno: "Toro", pietra: "Smeraldo", colore: "Verde", affinita: "Vergine e Capricorno", oroscopo: "Stabilità e amore per l'armonia consolidano ogni progetto di vita e di benessere." },
            { segno: "Gemelli", pietra: "Agata", colore: "Giallo", affinita: "Bilancia e Acquario", oroscopo: "Versatilità e ingegno brillante facilitano la comunicazione e le relazioni interpersonali." },
            { segno: "Cancro", pietra: "Perla", colore: "Bianco / Argento", affinita: "Scorpione e Pesci", oroscopo: "La memoria e i legami affettivi profondi offrono protezione e forza interiore duratura." },
            { segno: "Leone", pietra: "Topazio", colore: "Oro / Arancione", affinita: "Ariete e Sagittario", oroscopo: "Carisma e generosità illuminano la scena e attraggono grandi soddisfazioni personali." },
            { segno: "Vergine", pietra: "Zaffiro", colore: "Marrone / Blu Scuro", affinita: "Toro e Capricorno", oroscopo: "Precisione e analisi meticolosa portano a risultati eccellenti e concreti." },
            { segno: "Bilancia", pietra: "Opale", colore: "Rosa / Celeste", affinita: "Gemelli e Acquario", oroscopo: "Il senso dell'equilibrio e la diplomazia creano armonia in ogni contesto." },
            { segno: "Scorpione", pietra: "Topazio Scuro", colore: "Rosso Scuro / Nero", affinita: "Cancro e Pesci", oroscopo: "Passione intensa e magnetismo rivelano profonde verità e grandi potenzialità nascoste." },
            { segno: "Sagittario", pietra: "Turchese", colore: "Blu Scuro / Viola", affinita: "Ariete e Leone", oroscopo: "Ottimismo e spirito d'avventura allargano gli orizzonti verso nuove ed entusiasmanti mete." }
        ];

        function riduciA90(valore) {
            let res = valore % 90;
            return res === 0 ? 90 : res;
        }

        function calcolaValoreTesto(testo) {
            const lettere = testo.toUpperCase().replace(/[^A-Z]/g, '');
            let somma = 0;
            for (let i = 0; i < lettere.length; i++) {
                somma += (lettere.charCodeAt(i) - 64);
            }
            return somma;
        }

        function determinaSegnoDaData(giorno, mese) {
            // Logica standard di assegnazione segno zodiacale in base a giorno e mese
            giorno = parseInt(giorno, 10);
            mese = parseInt(mese, 10);

            if ((mese === 3 && giorno >= 21) || (mese === 4 && giorno <= 19)) return 3; // Ariete
            if ((mese === 4 && giorno >= 20) || (mese === 5 && giorno <= 20)) return 4; // Toro
            if ((mese === 5 && giorno >= 21) || (mese === 6 && giorno <= 20)) return 5; // Gemelli
            if ((mese === 6 && giorno >= 21) || (mese === 7 && giorno <= 22)) return 6; // Cancro
            if ((mese === 7 && giorno >= 23) || (mese === 8 && giorno <= 22)) return 7; // Leone
            if ((mese === 8 && giorno >= 23) || (mese === 9 && giorno <= 22)) return 8; // Vergine
            if ((mese === 9 && giorno >= 23) || (mese === 10 && giorno <= 22)) return 9; // Bilancia
            if ((mese === 10 && giorno >= 23) || (mese === 11 && giorno <= 21)) return 10; // Scorpione
            if ((mese === 11 && giorno >= 22) || (mese === 12 && giorno <= 21)) return 11; // Sagittario
            if ((mese === 12 && giorno >= 22) || (mese === 1, giorno <= 19)) return 0; // Capricorno
            if ((mese === 1 && giorno >= 20) || (mese === 2 && giorno <= 18)) return 1; // Acquario
            return 2; // Pesci
        }

        function calcolaProfiloAstro() {
            const nomeInput = document.getElementById('nome').value.trim();
            const giornoInput = document.getElementById('giorno').value.trim();
            const meseInput = document.getElementById('mese').value.trim();
            const annoInput = document.getElementById('anno').value.trim();
            const oraInput = document.getElementById('ora').value.trim();
            const comuneInput = document.getElementById('comune').value.trim();
            const divRisultato = document.getElementById('risultato');

            if (!nomeInput || !giornoInput || !meseInput || !annoInput || !comuneInput) {
                divRisultato.style.display = 'block';
                divRisultato.innerHTML = '<div class="error-msg">Si prega di compilare tutti i campi obbligatori.</div>';
                return;
            }

            const anno = parseInt(annoInput, 10);
            const giorno = parseInt(giornoInput, 10);
            const mese = parseInt(meseInput, 10);

            if (isNaN(anno) || anno < 1900 || anno > 2026 || isNaN(giorno) || giorno < 1 || giorno > 31) {
                divRisultato.style.display = 'block';
                divRisultato.innerHTML = '<div class="error-msg">Verificare che i valori numerici di data siano validi.</div>';
                return;
            }

            const comuneKey = comuneInput.toUpperCase();
            let valoreComune = databaseComuni[comuneKey] !== undefined ? databaseComuni[comuneKey] : calcolaValoreTesto(comuneKey);
            const valoreNome = calcolaValoreTesto(nomeInput);

            // Calcolo Numeri Astrali
            const num1 = riduciA90(valoreNome + anno + giorno);
            const num2 = riduciA90(valoreComune + (anno % 100) + mese);
            const num3 = riduciA90(valoreNome + valoreComune + anno + giorno + mese);

            // Estrazione Profilo Zodiacale
            const indiceSegno = determinaSegnoDaData(giorno, mese);
            const profilo = datiZodiacali[indiceSegno];

            divRisultato.style.display = 'block';
            divRisultato.innerHTML = `
                <div class="result-title">ANALISI MASTER GEODINAMICO PER ${nomeInput.toUpperCase()}</div>
                <div class="result-item"><strong>Data e Luogo:</strong> ${giorno}/${mese}/${anno} ore ${oraInput || 'N.D.'} - ${comuneInput}</div>
                <div class="result-item"><strong>Segno Zodiacale / Archetipo:</strong> ${profilo.segno}</div>
                <div class="result-item"><strong>Oroscopo & Tendenze:</strong> ${profilo.oroscopo}</div>
                <div class="result-item"><strong>Pietra Preziosa:</strong> ${profilo.pietra}</div>
                <div class="result-item"><strong>Colore Guida:</strong> ${profilo.colore}</div>
                <div class="result-item"><strong>Affinità Emozionale:</strong> ${profilo.affinita}</div>
                <div class="numbers-box">
                    NUMERI ASTRALI: ${num1} - ${num2} - ${num3}
                </div>
            `;
        }
    </script>

</body>
</html>
