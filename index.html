<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroMatrix FREE - Dashboard Geodinamica</title>
    <!-- Font Awesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #131722;
            --input-bg: #1c2230;
            --border-color: #2a3245;
            --gold-primary: #f0b429;
            --gold-light: #f7d070;
            --gold-hover: #d99f1f;
            --text-main: #e6e8ec;
            --text-muted: #9aa5b5;
            --accent-red: #e53935;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .main-card {
            width: 100%;
            max-width: 720px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand i {
            color: var(--accent-red);
            font-size: 26px;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-primary);
            letter-spacing: 2px;
        }

        .brand-sub {
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            display: block;
        }

        .badge {
            background-color: rgba(240, 180, 41, 0.12);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .hero-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-title h1 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .hero-title p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 550px;
            margin: 0 auto;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-label i {
            margin-right: 5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 8px rgba(240, 180, 41, 0.3);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1.4fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 580px) {
            .grid-3, .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .btn-calculate {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-primary), #c99018);
            color: #0b0d12;
            border: none;
            border-radius: 6px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(240, 180, 41, 0.2);
        }

        .btn-calculate:hover {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(240, 180, 41, 0.4);
        }

        #output-container {
            display: none;
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px dashed var(--border-color);
        }

        .result-card {
            background-color: var(--input-bg);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            padding: 25px;
        }

        .result-header {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: var(--gold-primary);
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .info-val {
            color: #ffffff;
            font-weight: 600;
            text-align: right;
        }

        .horoscope-box {
            background-color: rgba(11, 13, 18, 0.6);
            border-left: 3px solid var(--gold-primary);
            padding: 12px 15px;
            margin: 15px 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);
            font-style: italic;
        }

        .weekly-horoscope {
            background-color: rgba(240, 180, 41, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin: 15px 0;
        }

        .weekly-title {
            font-size: 12px;
            color: var(--gold-primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .astral-numbers {
            background: linear-gradient(135deg, rgba(240, 180, 41, 0.15), rgba(240, 180, 41, 0.05));
            border: 1px solid var(--gold-primary);
            border-radius: 6px;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        .astral-numbers-title {
            font-size: 12px;
            color: var(--gold-primary);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .astral-numbers-val {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 3px;
        }

        .error-message {
            color: var(--accent-red);
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            padding: 12px;
            background-color: rgba(229, 57, 53, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header-bar">
            <div class="brand">
                <i class="fa-solid fa-asterisk"></i>
                <div>
                    <span class="brand-title">ASTROMATRIX</span>
                    <span class="brand-sub">DASHBOARD GEODINAMICA</span>
                </div>
            </div>
            <div class="badge">FREE EDITION</div>
        </div>

        <div class="hero-title">
            <h1>IL TUO PROFILO ASTRALE</h1>
            <p>Inserisci nome, giorno, mese, anno, ora e città di nascita per generare l'analisi dettagliata estratta direttamente dal Master Geodinamico.</p>
        </div>

        <form id="astroForm">
            <div style="margin-bottom: 20px;">
                <label class="form-label" for="nome"><i class="fa-solid fa-user"></i> NOME</label>
                <input type="text" id="nome" class="form-control" placeholder="Inserisci il tuo nome (es. Adolfo)" required>
            </div>

            <div class="grid-3">
                <div>
                    <label class="form-label" for="giorno"><i class="fa-solid fa-calendar-day"></i> GIORNO (1-31)</label>
                    <input type="number" id="giorno" class="form-control" min="1" max="31" placeholder="GG" required>
                </div>
                <div>
                    <label class="form-label" for="mese"><i class="fa-solid fa-calendar-alt"></i> MESE DI NASCITA</label>
                    <select id="mese" class="form-control" required>
                        <option value="">Seleziona</option>
                        <option value="1">Gennaio</option>
                        <option value="2">Febbraio</option>
                        <option value="3">Marzo</option>
                        <option value="4">Aprile</option>
                        <option value="5">Maggio</option>
                        <option value="6">Giugno</option>
                        <option value="7">Luglio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Settembre</option>
                        <option value="10">Ottobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Dicembre</option>
                    </select>
                </div>
                <div>
                    <label class="form-label" for="anno"><i class="fa-solid fa-calendar"></i> ANNO (AAAA)</label>
                    <input type="number" id="anno" class="form-control" min="1900" max="2026" placeholder="AAAA" required>
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label class="form-label" for="ora"><i class="fa-solid fa-clock"></i> ORA DI NASCITA *</label>
                    <input type="text" id="ora" class="form-control" placeholder="Es. 16:30">
                </div>
                <div>
                    <label class="form-label" for="comune"><i class="fa-solid fa-location-dot"></i> CITTÀ / COMUNE DI NASCITA</label>
                    <input type="text" id="comune" class="form-control" placeholder="Es. Napoli" required>
                </div>
            </div>

            <button type="button" id="btnCalcola" class="btn-calculate">
                <i class="fa-solid fa-calculator"></i> CALCOLA PROFILO GRATUITO
            </button>
        </form>

        <div id="output-container">
            <div id="result-content"></div>
        </div>
    </div>
