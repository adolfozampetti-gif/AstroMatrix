    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: #131722;
            --input-bg: #1c2230;
            --border-color: #2a3245;
            --gold-primary: #f0b429;
            --gold-light: #f7d070;
            --gold-hover: #d99f1f;
            --text-main: #e6e8ec;
            --text-muted: #9aa5b5;
            --accent-red: #e53935;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .main-card {
            width: 100%;
            max-width: 720px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand i { color: var(--accent-red); font-size: 26px; }
        .brand-title { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; color: var(--gold-primary); letter-spacing: 2px; }
        .brand-sub { font-size: 9px; color: var(--text-muted); letter-spacing: 1.5px; display: block; }

        .badge {
            background-color: rgba(240, 180, 41, 0.12);
            color: var(--gold-primary);
            border: 1px solid var(--gold-primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .hero-title { text-align: center; margin-bottom: 30px; }
        .hero-title h1 { font-family: 'Cinzel', serif; font-size: 28px; color: #ffffff; letter-spacing: 2px; margin-bottom: 10px; }
        .hero-title p { font-size: 13px; color: var(--text-muted); line-height: 1.5; max-width: 550px; margin: 0 auto; }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s ease;
        }

        .form-control:focus { outline: none; border-color: var(--gold-primary); box-shadow: 0 0 8px rgba(240, 180, 41, 0.3); }

        .grid-3 { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 15px; margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1.2fr; gap: 15px; margin-bottom: 25px; }

        @media (max-width: 580px) {
            .grid-3, .grid-2 { grid-template-columns: 1fr; }
        }

        .btn-calculate {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-primary), #c99018);
            color: #0b0d12;
            border: none;
            border-radius: 6px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(240, 180, 41, 0.2);
        }

        .btn-calculate:hover { background: linear-gradient(135deg, var(--gold-light), var(--gold-primary)); transform: translateY(-1px); }

        #output-container { display: none; margin-top: 35px; padding-top: 25px; border-top: 1px dashed var(--border-color); }

        .result-card {
            background-color: var(--input-bg);
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            padding: 25px;
        }

        .result-header {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            color: var(--gold-primary);
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; line-height: 1.6; }
        .info-label { color: var(--text-muted); font-weight: 600; }
        .info-val { color: #ffffff; font-weight: 600; text-align: right; }

            padding: 12px 15px;
            margin: 15px 0;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);

            border: 1px solid var(--accent-red);
            border-radius: 6px;
            line-height: 1.5;

    </style>
</head>

        function riduciA90(valore) {
            let res = valore % 90;
            return res === 0 ? 90 : res;
        }

        function calcolaValoreTesto(testo) {
            const lettere = testo.toUpperCase().replace(/[^A-Z]/g, '');
            let somma = 0;
            for (let i = 0; i < lettere.length; i++) {
                somma += (lettere.charCodeAt(i) - 64);
            }
            return somma || 1;
        }

        function determinaSegnoZodiacale(giorno, mese) {
            let g = parseInt(giorno, 10);
            let m = parseInt(mese, 10);
            
            for (let item of mappaZodiacale) {
                let [mInizio, gInizio] = item.inizio;
                let [mFine, gFine] = item.fine;
                
                if ((m === mInizio && g >= gInizio) || (m === mFine && g <= gFine)) {
                    return item;
                }
            }
            return mappaZodiacale[0];
        }

        function elaboraAstroMatrix() {
            const nomeInput = document.getElementById('nome').value.trim();
            const giorno = document.getElementById('giorno').value.trim();
            const mese = document.getElementById('mese').value.trim();
            const anno = document.getElementById('anno').value.trim();
            const ora = document.getElementById('ora').value.trim();
            const comune = document.getElementById('comune').value.trim();
            
            const container = document.getElementById('output-container');
            const resultContent = document.getElementById('result-content');

            // 1. Controllo campi obbligatori vuoti
            if (!nomeInput || !giorno || !mese || !anno || !comune) {
                container.style.display = 'block';
                resultContent.innerHTML = '<div class="error-message"><i class="fa-solid fa-triangle-exclamation"></i> Attenzione: Tutti i campi (Nome, Giorno, Mese, Anno e Comune) sono obbligatori!</div>';
                container.scrollIntoView({ behavior: 'smooth' });
                return;
            }

            const gNum = parseInt(giorno, 10);
            const mNum = parseInt(mese, 10);
            const aNum = parseInt(anno, 10);

            // 2. Controllo validità data
