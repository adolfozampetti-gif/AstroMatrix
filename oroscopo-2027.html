// FORMULA GIORNI FORTUNATI ASTRINRETE 2027 - trasparente e sempre uguale per stesso segno+mese
// S = indice segno (0=Ariete ... 11=Pesci), M = indice mese (0=Gennaio ... 11=Dicembre)
// 1° fortunato: 1 + ((S*7 + M*3) % 15)  -> sempre 1-15. 7 e 15 sono coprimi, quindi i 12 segni hanno 12 giorni diversi nello stesso mese.
// 2° fortunato: 16 + ((S*7 + M*5) % (giorniDelMese-15)) -> sempre 16-fine mese. 7 e coprimo con 13,15,16, quindi anche qui 12 giorni diversi.
// I due sono sempre diversi tra loro perche stanno in due quindicine diverse.
function giorniFortunati(sIdx,mIdx){let giorni=GIORNI_MESE_2027[mIdx];let primo=1+((sIdx*7+mIdx*3)%15);let L=giorni-15;let secondo=16+((sIdx*7+mIdx*5)%L);let piano=1+((sIdx*11+mIdx*7+8)%giorni);while(piano===primo||piano===secondo){piano=piano%giorni+1}return{primo,secondo,piano}}
